# agent-platform/backend/src/main/resources/application.yml
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: agent-platform

  # @Scheduled 默认单线程池；IndexJobWorker + ReconciliationWorker 两轮询共存时须 ≥2，防慢对账饿死 embed 轮询
  task:
    scheduling:
      pool:
        size: 2

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agent_platform}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:aa64221886}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:/com/superprogrammer/**/mapper/xml/*.xml
  type-aliases-package: com.superprogrammer.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # !! 安全警告 !!
  # 以下默认密钥仅用于本地开发环境，生产环境务必通过环境变量 JWT_SECRET 设置独立密钥
  # 生成方式: openssl rand -base64 64 | tr -d '\n'
  secret: ${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckFnZW50UGxhdGZvcm1Qcm9qZWN0MjAyNg==}
  access-expiration: 900000
  refresh-expiration: 604800000

logging:
  level:
    com.superprogrammer: DEBUG
    org.springframework.security: DEBUG

# Agent Markdown数据目录（可选，配置后启用Markdown同步功能）
agent:
  data-path: ${AGENT_DATA_PATH:}

runtime:
  gateway:
    mode: sidecar
    sidecar-base-url: http://localhost:8090
    java-callback-base-url: http://localhost:8080

rag:
  visibility-cache:
    enabled: true
    ttl-ms: 1800000
    scan-count: 100
  answer-cache:
    enabled: false
    sim-threshold: 0.90
    top-n: 5
    ttl-days: 7
  reconciliation:
    enabled: false          # 阶段7 对账 + decay 清理 worker（opt-in）
    poll-ms: 600000         # 10 分钟
    decay-batch: 500
    kb-batch: 20
    auto-repair: false      # drift → REINDEX：claimBatch 已消费 REINDEX，翻 true 即修复（承担 re-embed 计费）

# 钉钉 H5 微应用免登（默认关，配齐 AppKey/AppSecret 再开）
dingtalk:
  enabled: ${DINGTALK_ENABLED:false}
  app-key: ${DINGTALK_APP_KEY:}
  app-secret: ${DINGTALK_APP_SECRET:}
  agent-id: ${DINGTALK_AGENT_ID:}
