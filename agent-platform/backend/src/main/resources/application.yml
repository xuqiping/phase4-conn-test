# agent-platform/backend/src/main/resources/application.yml
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: agent-platform

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agent_platform}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:/com/superprogrammer/**/mapper/xml/*.xml
  type-aliases-package: com.superprogrammer.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # !! 安全警告 !!
  # 以下默认密钥仅用于本地开发环境，生产环境务必通过环境变量 JWT_SECRET 设置独立密钥
  # 生成方式: openssl rand -base64 64 | tr -d '\n'
  secret: ${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckFnZW50UGxhdGZvcm1Qcm9qZWN0MjAyNg==}
  access-expiration: 900000
  refresh-expiration: 604800000

logging:
  level:
    com.superprogrammer: DEBUG
    org.springframework.security: DEBUG

# Agent Markdown数据目录（可选，配置后启用Markdown同步功能）
agent:
  data-path: ${AGENT_DATA_PATH:}
