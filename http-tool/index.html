<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Keeper HTTP 调试工具</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #0f172a;
      color: #e2e8f0;
    }
    h1 { margin: 0 0 16px; font-size: 20px; color: #38bdf8; }
    .container { max-width: 1200px; margin: 0 auto; }
    .row { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
    label { font-size: 13px; color: #94a3b8; min-width: 60px; }
    input, select, textarea, button {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: #38bdf8; }
    input[type="text"] { flex: 1; min-width: 200px; }
    select { min-width: 100px; }
    textarea { width: 100%; min-height: 120px; font-family: "Consolas", "Monaco", monospace; resize: vertical; }
    button {
      cursor: pointer;
      background: #0ea5e9;
      border: none;
      color: #fff;
      font-weight: 500;
      padding: 8px 18px;
    }
    button:hover { background: #0284c7; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    .panel { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .panel-title { font-size: 14px; font-weight: 600; color: #38bdf8; margin-bottom: 12px; }
    .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .preset-btn {
      background: #1e293b;
      border: 1px solid #475569;
      color: #cbd5e1;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 4px;
    }
    .preset-btn:hover { background: #334155; }
    .response-meta { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
    .response-body {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      font-family: "Consolas", "Monaco", monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 500px;
      overflow: auto;
      color: #a5f3fc;
    }
    .error { color: #f87171; }
    .success { color: #4ade80; }
    .hint { font-size: 12px; color: #64748b; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 File Keeper HTTP 调试工具</h1>

    <div class="panel">
      <div class="panel-title">常用接口预设</div>
      <div class="presets" id="presets"></div>
    </div>

    <div class="panel">
      <div class="panel-title">请求配置</div>
      <div class="row">
        <label>基础地址</label>
        <input type="text" id="baseUrl" value="http://localhost:8088" />
      </div>
      <div class="row">
        <label>方法</label>
        <select id="method">
          <option value="GET">GET</option>
          <option value="POST">POST</option>
          <option value="PUT">PUT</option>
          <option value="DELETE">DELETE</option>
        </select>
        <label>路径</label>
        <input type="text" id="path" value="/api/admin/users" />
        <button id="sendBtn">发送请求</button>
      </div>
      <div class="row" style="align-items: flex-start;">
        <label style="margin-top: 8px;">Headers</label>
        <textarea id="headers">{
  "Authorization": "Bearer ",
  "Content-Type": "application/json"
}</textarea>
      </div>
      <div class="hint">提示：登录后把 accessToken 填到 Authorization 的 Bearer 后面</div>
      <div class="row" style="align-items: flex-start;">
        <label style="margin-top: 8px;">Body</label>
        <textarea id="body"></textarea>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">响应结果</div>
      <div class="response-meta" id="responseMeta">点击“发送请求”查看结果</div>
      <pre class="response-body" id="responseBody">// 响应内容将显示在这里</pre>
    </div>
  </div>

  <script>
    const presets = [
      { name: '管理员登录', method: 'POST', path: '/api/admin/auth/login', body: { identifier: 'admin@example.com', password: 'Password123!' } },
      { name: '刷新 Token', method: 'POST', path: '/api/admin/auth/refresh', body: { refreshToken: '' } },
      { name: '用户列表', method: 'GET', path: '/api/admin/users?page=1&size=20', body: null },
      { name: '用户详情', method: 'GET', path: '/api/admin/users/1', body: null },
      { name: '审批用户', method: 'POST', path: '/api/admin/users/1/approve', body: { note: '审批通过' } },
      { name: '禁用用户', method: 'POST', path: '/api/admin/users/1/disable', body: { note: '违规操作' } },
      { name: '启用用户', method: 'POST', path: '/api/admin/users/1/enable', body: { note: '恢复使用' } },
      { name: '修改用户设置', method: 'PUT', path: '/api/admin/users/1/settings', body: { deviceLimit: 3, offlineCacheMinutes: 60 } },
      { name: '查询用户权益', method: 'GET', path: '/api/admin/users/1/entitlements', body: null },
      { name: '授予权益', method: 'POST', path: '/api/admin/users/1/entitlements', body: { moduleCode: 'work-report', expiresAt: '2026-12-31T23:59:59+08:00' } },
      { name: '查询用户设备', method: 'GET', path: '/api/admin/users/1/devices', body: null },
      { name: '匿名设备列表', method: 'GET', path: '/api/admin/anonymous-devices?page=1&size=20', body: null },
      { name: '获取系统设置', method: 'GET', path: '/api/admin/settings', body: null },
      { name: '更新系统设置', method: 'PUT', path: '/api/admin/settings', body: { defaultDeviceLimit: 2, defaultOfflineCacheMinutes: 30, anonymousTrialDays: 7, freeModuleChangeDays: 30 } },
      { name: '仪表盘统计', method: 'GET', path: '/api/admin/stats/dashboard', body: null }
    ];

    const baseUrlInput = document.getElementById('baseUrl');
    const methodInput = document.getElementById('method');
    const pathInput = document.getElementById('path');
    const headersInput = document.getElementById('headers');
    const bodyInput = document.getElementById('body');
    const sendBtn = document.getElementById('sendBtn');
    const responseMeta = document.getElementById('responseMeta');
    const responseBody = document.getElementById('responseBody');

    const presetsContainer = document.getElementById('presets');
    presets.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'preset-btn';
      btn.textContent = p.name;
      btn.onclick = () => loadPreset(p);
      presetsContainer.appendChild(btn);
    });

    function loadPreset(p) {
      methodInput.value = p.method;
      pathInput.value = p.path;
      bodyInput.value = p.body ? JSON.stringify(p.body, null, 2) : '';
    }

    function getHeaders() {
      try {
        return JSON.parse(headersInput.value || '{}');
      } catch (e) {
        alert('Headers JSON 格式错误：' + e.message);
        return null;
      }
    }

    function formatJson(str) {
      try {
        return JSON.stringify(JSON.parse(str), null, 2);
      } catch {
        return str;
      }
    }

    sendBtn.onclick = async () => {
      const headers = getHeaders();
      if (!headers) return;

      const url = baseUrlInput.value.replace(/\/$/, '') + pathInput.value;
      const method = methodInput.value;
      const body = bodyInput.value;

      sendBtn.disabled = true;
      sendBtn.textContent = '发送中...';
      responseMeta.textContent = '发送中...';
      responseBody.textContent = '';

      try {
        const res = await fetch('/api/proxy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, method, headers, body })
        });

        const data = await res.json();

        if (data.error) {
          responseMeta.innerHTML = '<span class="error">错误：' + data.error + '</span>';
          responseBody.textContent = '';
        } else {
          const statusClass = data.status >= 200 && data.status < 300 ? 'success' : 'error';
          responseMeta.innerHTML = '<span class="' + statusClass + '">HTTP ' + data.status + ' ' + (data.statusText || '') + '</span>';
          responseBody.textContent = formatJson(data.body);

          // 如果是登录接口，自动提示保存 token
          if (pathInput.value === '/api/admin/auth/login' && data.status === 200) {
            try {
              const parsed = JSON.parse(data.body);
              if (parsed.data && parsed.data.accessToken) {
                responseMeta.innerHTML += ' <span class="success">（可复制 accessToken 到 Headers 中）</span>';
              }
            } catch {}
          }
        }
      } catch (err) {
        responseMeta.innerHTML = '<span class="error">请求失败：' + err.message + '</span>';
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = '发送请求';
      }
    };
  </script>
</body>
</html>
