[package]
name = "file-keeper"
default-run = "file-keeper"
version = "0.1.0"
description = "轻量级跨平台文件收藏管理器 - 快速访问常用文件的可视化工具"
authors = ["File Keeper Team"]
license = "MIT"
repository = "https://github.com/yourusername/file-keeper"
homepage = "https://github.com/yourusername/file-keeper"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-store = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-opener = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
sysinfo = "0.30"
lazy_static = "1.4"
opener = "0.7"
png = "0.17"
base64 = "0.22"
regex = "1.10"
sha2 = "0.10"
url = "2.5"
rusqlite = { version = "0.31", features = ["bundled"] }
hmac = "0.12"
ed25519-dalek = "2.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
dirs = "5.0"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
quick-xml = "0.39.4"
keyring = "=2.3.3"
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_UI_Input_KeyboardAndMouse",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams"
] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"
core-foundation = "0.9"
