# 运维系统 Step 9：Prometheus 数据源 provisioning（部署拷到 E:\IT\ops\grafana\conf\provisioning\datasources\）
# uid 固定为 prometheus——四个看板 JSON 按此 uid 引用，勿改
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
