<!DOCTYPE html>
<html lang="zh-CN" data-theme="neon-pulse">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Platform · 样式预览版</title>
    <script>
      // 首帧前恢复主题，防 FOUC（无样式闪烁：先露默认底再换装的闪一下）。
      // 非法值/读失败统一回退 neon-pulse；URL ?theme= 优先（走查/分享用开关）。
      ;(function () {
        var VALID = ['neon-pulse', 'calm-slate', 'hybrid-glow', 'cineon']
        var t = ''
        try {
          var q = new URLSearchParams(location.search).get('theme')
          t = q || localStorage.getItem('frontnew-theme') || ''
        } catch (e) { /* 隐私模式读失败 → 默认 */ }
        if (VALID.indexOf(t) === -1) t = 'neon-pulse'
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
