[package]
name = "core-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "MCP 客户端：进程管理 + stdio JSON-RPC（FR-010/026）"

[dependencies]
core-sandbox = { path = "../core-sandbox" }
core-state = { path = "../core-state" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros", "sync"] }
