; 运维系统 Step 8：Grafana 自定义配置（部署时拷到 D:\IT\ops\grafana\conf\custom.ini）
; 只覆盖与安全/路径相关的最小集；看板 provisioning 配置属 Step 9 追加。

[server]
; 安全红线：监控组件仅本机可达，不经 Nginx 反代（与 /actuator 同策略）
http_addr = 127.0.0.1
http_port = 3000

[security]
; 默认 admin/admin，首次登录强制改密（见运维手册）；密钥类配置绝不写进本文件入库版本
admin_user = admin

[users]
; 界面默认简体中文（用户可在个人偏好里自行切换）
default_language = zh-Hans

[paths]
; 数据目录留在安装目录内，随备份策略走
data = D:/IT/ops/grafana/data
logs = D:/IT/ops/grafana/data/log
plugins = D:/IT/ops/grafana/data/plugins
