[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-log = "2"
sherpa-rs = "0.6.8"
sherpa-rs-sys = "0.6.8"
cpal = "0.17.1"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
# Step 3 (FR-101): WGC window capture. Windows-only crate → lives in this section.
windows-capture = "2.0.0"
windows = { version = "0.61", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_Foundation", "Win32_System_Threading", "Win32_Devices_Properties", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Media_Multimedia", "Win32_System_Variant"] }
