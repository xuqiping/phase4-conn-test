[package]
name = "devpilot"
version = "0.1.0"
description = "DevPilot 桌面客户端（懂开发方法论的 AI 编程合伙人）"
edition = "2021"
rust-version = "1.77"

[lib]
name = "devpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
